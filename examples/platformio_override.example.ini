; GPT Matrix FX v0.2.2 - add-only PlatformIO example (English).
;
; In the existing [env:YOUR_WLED_ENV] section used for your WLED build,
; locate custom_usermods and APPEND exactly one of the following entries:
;
; OPTION A: Relative path (recommended if the module and WLED are siblings):
;   symlink://../wled-usermod-gpt-matrix-fx
;
; OPTION B: Absolute path (replace with the real filesystem path):
;   symlink:///absolute/path/to/wled-usermod-gpt-matrix-fx
;
; The relative path starts at the WLED PROJECT ROOT (containing platformio.ini).
; Keep all existing usermod entries and config inheritance intact. Do not
; add another environment section or replace the entire custom_usermods list.
; The WLED AudioReactive usermod is needed for GPTA01 through GPTA05.
;
; From the WLED project root, compile with:
;   pio run -e YOUR_WLED_ENV
;
; YOUR_WLED_ENV is a placeholder for the selected PlatformIO environment name.

; Experimental GPT24b trigonometry backend (v0.3.0-dev.10):
; APPEND one flag to the existing WLED environment's build_flags, preserving
; its inherited/common flags and all other defines.
;   -DGPTFX_GPT24_TRIG_BACKEND=0   ; libm reference, old dev.9 behavior
;   -DGPTFX_GPT24_TRIG_BACKEND=1   ; nearest LUT, lower fidelity
;   -DGPTFX_GPT24_TRIG_BACKEND=2   ; linear LUT, default; omit to select this

; New dev.11 additional-effect backend flags (OPTIONAL):
; Both default values can be omitted. Preserve all existing build_flags.
;   -DGPTFX_EXTRA_TRIG_BACKEND=2  ; GPT08/GPT20 LUT (default)
;   -DGPTFX_EXTRA_TRIG_BACKEND=0  ; GPT08/GPT20 libm A/B control
;   -DGPTFX_GPT18_TRIG_BACKEND=0  ; GPT18 native libm (default)
;   -DGPTFX_GPT18_TRIG_BACKEND=2  ; GPT18 opt-in LUT candidate

; New dev.12 GPT18 phase-bounding candidate (OPTIONAL):
; APPEND a single plain flag to the existing build_flags if overriding.
;   -DGPTFX_GPT18_PHASE_BOUNDING=1  ; default: bound time-only phases
;   -DGPTFX_GPT18_PHASE_BOUNDING=0  ; frozen dev.11 comparison
; Keep GPTFX_GPT18_TRIG_BACKEND=0 for the first physical comparison so that
; phase normalization and the optional LUT are NOT tested simultaneously.

; New dev.13 Stage-1 periodic time-phase bounding (OPTIONAL):
; Preserves existing build_flags; default = 1, no flag needed.
;   -DGPTFX_STAGE1_PHASE_BOUNDING=1  ; bound six selected effects (default)
;   -DGPTFX_STAGE1_PHASE_BOUNDING=0  ; exact original dev.12 rendering A/B
; This does not alter the GPT18/GPT24b flags or LUT backends.

; New dev.14 Stage-2A phase bounding (OPTIONAL):
; No flag is required for default behavior. Preserve all inherited flags.
;   -DGPTFX_STAGE2_PHASE_BOUNDING=1  ; GPT01, GPT02, GPT09, GPT10, GPT14, GPT16 (default)
;   -DGPTFX_STAGE2_PHASE_BOUNDING=0  ; exact dev.13 rendering for these six
; This flag is independent of Stage-1, GPT18 and GPT24b controls.

; New dev.14a GPT10 targeted remediation flags (OPTIONAL):
; Both defaults are enabled when GPTFX_STAGE2_PHASE_BOUNDING=1.
;   -DGPTFX_GPT10_CELL_CACHE=1       ; exact seed cache (default)
;   -DGPTFX_GPT10_CELL_CACHE=0       ; recompute native sinf for every pixel
;   -DGPTFX_GPT10_PACKET_BOUNDING=1  ; complete temporal packet phase (default)
;   -DGPTFX_GPT10_PACKET_BOUNDING=0  ; original dev.14 packet argument
; With both new flags =0, GPT10 is pixel-identical to dev.14.
; With Stage-2A =0, packet bounding defaults to 0 unless overridden,
; allowing the old dev.13 reference behavior. Preserve inherited flags.
